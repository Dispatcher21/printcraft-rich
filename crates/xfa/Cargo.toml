[package]
name = "printcraft-xfa"
description = "XFA forms: lay out dynamic forms as pages and fields, and save field values back into the XFA data"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
printcraft-cos = { workspace = true }
printcraft-fonts = { workspace = true }
printcraft-forms = { workspace = true }
printcraft-js = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b", "js"] }

[dev-dependencies]
hayro-syntax = { workspace = true }
